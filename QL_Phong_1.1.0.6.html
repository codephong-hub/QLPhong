<style>

.card span{font-size:14px}
.card em{font-style:normal;font-size:15px;font-weight:600;min-height:20px}
.st{width:22px;height:14px;border:2px solid #000;border-radius:4px;background:#b9bec6;display:block}
.st.on{background:#22c55e}
.g4 .card{min-height:76px;padding:6px 2px}
.g4 .card b{font-size:18px}.g4 .card span{display:none}.g4 .card em{font-size:12px}
.g4 .st{width:16px;height:10px}

.dv{border:1px solid var(--line);border-radius:8px}

.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum{margin:10px 0;font-weight:600}
.ft{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.warn{padding:10px;border:1px solid #e0a800;border-radius:8px;margin:8px 0;color:var(--fg)}

.box.fx{display:flex;flex-direction:column;padding:0;overflow:hidden}

.fx>.sc{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 16px 12px}
.fx>.err{flex:none;margin:0;padding:6px 16px 0;min-height:0}

.pr{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);margin-top:8px}
.pr span:last-child{color:var(--fg)}
.pr small{font-size:12px;margin-left:4px}
.pr input{width:120px;text-align:right}
.bdn{font-size:12px;color:var(--mut);text-align:right;min-height:14px}

.gt b{font-size:20px;color:var(--fg)}
</style></head><body>

<script>

function nextAt(t,h){var d=new Date(t),y=d.getFullYear(),m=d.getMonth(),n=d.getDate(),e=new Date(y,m,n,h).getTime();if(e<=t)e=new Date(y,m,n+1,h).getTime();return e}

function sh(h){var b=$("bx");b.innerHTML=h;var h2=b.firstElementChild,ac=b.lastElementChild;

b.insertBefore(sc,h2.nextSibling);b.className="box fx"}else b.className="box";
$("ov").className="ov on"}
var lim=false;function cl(){lim=false;dvLive=false;$("ov").className="ov"}

else{var o=nowM();dvq=JSON.parse(JSON.stringify(a.dv||{}));dvLive=false;sh(hd+'<label>Tên khách</label><input value="'+esc(a.name||"")+'" placeholder="—" disabled><div class="r2"><div><label>Ngày vào</label><input type="date" id="d" value="'+dI(a.inTs)+'" oninput="tt()"></div><div><label>Giờ vào</label><input type="text" inputmode="numeric" placeholder="HH:mm" class="tm" id="t" value="'+tI(a.inTs)+'" oninput="tt()"></div></div><div class="r2"><div><label>Ngày ra</label><input type="date" id="d2" value="'+dI(o)+'" oninput="tt()"></div><div><label>Giờ ra</label><input type="text" inputmode="numeric" placeholder="HH:mm" class="tm" id="t2" value="'+tI(o)+'" oninput="tt()"></div></div><div class="tot" id="tot"></div><div class="err" id="er"></div><label>Số người</label><div class="step lk"><button disabled>−</button><b>'+a.people+'</b><button disabled>+</button></div><label>Combo</label><select disabled><option>'+esc(cbName(a.combo))+'</option></select>'+gDis(a)+prHtml(a)+dvHtml()+gtHtml()+'<div class="act"><button class="pri" onclick="askCo()">Check out</button><button onclick="saveRoom()">Lưu thay đổi</button></div>');tt()}}
var gsel="1h";

function gOK(){return gWhy()===""}
function gf(){var w=$("gw");if(!w)return;var e=$("gf");if(e&&!e.disabled)gsel=e.value;var y=gWhy();if(y){w.innerHTML='<label>Tặng thêm</label><select id="gf" disabled><option>Không tặng</option></select><div class="gno">'+y+'</div>';return}
w.innerHTML='<label>Tặng thêm</label><select id="gf" onchange="gsel=this.value;gf()"><option value="1h">Tặng thêm 1h</option><option value="pt">1 điểm tích lũy</option></select><div class="gok">'+(gsel==="pt"?"Được cộng 1 điểm tích lũy.":"Combo 2h được ở đến 3h, quá 3h tính như thường.")+'</div>';$("gf").value=gsel}
function gDis(a){return'<label>Tặng thêm</label><select disabled><option>'+(a.gift?gName(a.gift):"Không tặng")+'</option></select>'}
var GIACB={Chill:{"2h":140000,"6h":300000,"Qua đêm":220000,"Ngày":500000},Love:{"2h":180000,"6h":350000,"Qua đêm":270000,"Ngày":550000},Play:{"2h":180000,"6h":350000,"Qua đêm":270000,"Ngày":550000}};

function prHtml(a){return'<div id="pcr"><div class="pr"><span>Giá phòng combo</span><span id="pcb"></span></div><div class="pr"><span>Giá phòng vượt giờ<small id="pov"></small></span><span id="pov2"></span></div><div class="bdn" id="pbd"></div><div class="pr"><span>Giá phòng phạt</span><input id="ppen" inputmode="numeric" value="'+money(a.pen||0)+'" oninput="penIn(this)" onblur="penF(this)"></div><div class="pt"><span>Tiền phòng tạm tính:</span><b id="prm"></b></div></div>'}
function gtHtml(){return'<div class="gt"><span>Tổng tạm tính:</span><b id="pgt"></b></div>'}
function penIn(el){pc()}

function pc(){var box=$("pcr"),a=D.act[cur];if(!box||!a)return null;var i=pt($("d").value,$("t").value),o=pt($("d2").value,$("t2").value),cb=a.combo||"Thường",cp=0,over=0,overText="";
if(!isNaN(i)&&!isNaN(o)&&o>i){
  if(cb==="Qua đêm"){
